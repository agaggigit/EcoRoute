
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EcoRoute Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #E2E8F0;
        }

        .leaflet-container {
            font-family: 'Segoe UI', sans-serif;
        }

        .location-popup {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // INISIALISASI PETA
        const map = L.map('map', {
            zoomControl: false
        }).setView([-7.7956, 110.3695], 13);

        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        ).addTo(map);

        // MARKER
        let selectedMarker = null;
        let originMarker = null;

        // Hanya aktif saat State C
        let canSelectOrigin = false;

        // MARKER TUJUAN
        function showLocation(lat, lng, nama) {
            if (!Number.isFinite(lat) ||
                !Number.isFinite(lng)) {
                return;
            }

            if (selectedMarker !== null) {
                map.removeLayer(selectedMarker);
            }

            selectedMarker = L.marker([lat, lng])
                .addTo(map);

            const popup = document.createElement('div');
            popup.className = 'location-popup';
            popup.textContent = nama || 'Lokasi dipilih';

            selectedMarker.bindPopup(popup).openPopup();

            map.setView([lat, lng], 16, {
                animate: true
            });
        }

        function showLocationFromWpf(location) {
            if (!location) return;

            showLocation(
                Number(location.lat),
                Number(location.lng),
                location.nama
            );
        }

        function clearLocation() {
            if (selectedMarker !== null) {
                map.removeLayer(selectedMarker);
                selectedMarker = null;
            }
        }

        // MARKER TITIK ASAL
        function showOrigin(lat, lng) {
            if (originMarker !== null) {
                map.removeLayer(originMarker);
            }

            originMarker = L.circleMarker(
                [lat, lng],
                {
                    radius: 9,
                    color: '#FFFFFF',
                    weight: 3,
                    fillColor: '#22C55E',
                    fillOpacity: 1
                }
            ).addTo(map);

            originMarker.bindPopup('Titik Asal').openPopup();
        }

        function clearOrigin() {
            if (originMarker !== null) {
                map.removeLayer(originMarker);
                originMarker = null;
            }
        }

        // MENGATUR IZIN KLIK PETA
        function setOriginSelectionEnabled(enabled) {
            canSelectOrigin = enabled === true;

            if (!canSelectOrigin) {
                map.getContainer().style.cursor = '';
            } else {
                map.getContainer().style.cursor = 'crosshair';
            }
        }

        // KLIK PETA
        map.on('click', function (event) {
            if (!canSelectOrigin) {
                return;
            }

            const lat = event.latlng.lat;
            const lng = event.latlng.lng;

            showOrigin(lat, lng);

            if (window.chrome &&
                window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'mapClicked',
                    lat: lat,
                    lng: lng
                });
            }
        });

        // MEMBERI TAHU WPF PETA SUDAH SIAP
        map.whenReady(function () {
            if (window.chrome &&
                window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'mapReady'
                });
            }
        });
    </script>
</body>
</html>
