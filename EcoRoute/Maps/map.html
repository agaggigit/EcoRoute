
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EcoRoute Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        /* Warna disamakan dengan App.xaml */
        :root {
            --blue: #3B82F6;
            --green: #16A34A;
            --green-dark: #15803D;
            --text: #0F172A;
            --text-2: #64748B;
            --border: #E2E8F0;
            --card: #FFFFFF;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #EEF2F0;
        }

        .leaflet-container {
            font-family: 'Segoe UI', sans-serif;
        }

        /* Tile OSM dibuat lebih lembut supaya card & marker menonjol */
        .leaflet-tile-pane {
            filter: saturate(0.55) brightness(1.05) contrast(0.92);
        }

        /* ===== Kontrol zoom gaya card ===== */
        .leaflet-bar {
            border: 1px solid var(--border) !important;
            border-radius: 12px !important;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12) !important;
        }

        .leaflet-bar a,
        .leaflet-bar a:hover {
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 20px !important;
            font-weight: 400;
            color: var(--text-2) !important;
            background: var(--card) !important;
            border-bottom: 1px solid var(--border) !important;
        }

        .leaflet-bar a:hover {
            color: var(--text) !important;
            background: #F1F5F9 !important;
        }

        .leaflet-bar a:last-child {
            border-bottom: none !important;
        }

        .leaflet-bottom.leaflet-right .leaflet-control-zoom {
            margin: 0 16px 36px 0;
        }

        /* ===== Atribusi kecil & transparan ===== */
        .leaflet-control-attribution {
            background: rgba(255, 255, 255, 0.75) !important;
            backdrop-filter: blur(6px);
            border-radius: 8px 0 0 0;
            padding: 2px 8px !important;
            font-size: 10.5px;
            color: var(--text-2);
        }

        .leaflet-control-attribution a {
            color: var(--text-2);
        }

        /* ===== Popup ===== */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
        }

        .leaflet-popup-content {
            margin: 10px 14px;
        }

        .leaflet-popup-tip {
            box-shadow: none;
            border: 1px solid var(--border);
        }

        .location-popup {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .location-popup small {
            display: block;
            margin-top: 2px;
            font-size: 11.5px;
            font-weight: 400;
            color: var(--text-2);
        }

        /* ===== Marker tujuan (pin hijau) ===== */
        .eco-pin {
            background: none;
            border: none;
        }

        .eco-pin svg {
            filter: drop-shadow(0 4px 6px rgba(21, 128, 61, 0.35));
            transform-origin: 50% 100%;
            animation: pin-drop 0.45s cubic-bezier(.2, 1.4, .4, 1);
        }

        .eco-pin .pin-shadow {
            position: absolute;
            left: 50%;
            bottom: -3px;
            width: 14px;
            height: 5px;
            margin-left: -7px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.25);
        }

        @keyframes pin-drop {
            from { transform: translateY(-24px) scale(0.8); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== Pin tempat populer (ikon bulat + label) ===== */
        .poi {
            background: none;
            border: none;
        }

        .poi-inner {
            display: flex;
            align-items: center;
            white-space: nowrap;
            cursor: pointer;
        }

        .poi-dot {
            flex: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        .poi-dot svg {
            width: 13px;
            height: 13px;
        }

        .poi-label {
            margin-left: 5px;
            font-size: 12.5px;
            font-weight: 600;
            text-shadow:
                -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff,
                -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff,
                0 0 4px #fff;
        }

        .poi-inner:hover .poi-dot {
            transform: scale(1.18);
        }

        .poi-inner:hover .poi-label {
            text-decoration: underline;
        }

        /* Label disembunyikan saat zoom jauh supaya tidak tumpuk */
        .hide-poi-labels .poi-label {
            display: none;
        }

        /* ===== Skala jarak ===== */

        /* Label tambahan agar angka 500 m / 1 km mudah dipahami */
        .leaflet-control-scale::before {
            content: "Skala peta";
            display: block;
            margin-bottom: 4px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
        }

        .leaflet-control-scale-line {
            border: 2px solid var(--text-2);
            border-top: none;
            color: var(--text-2);
            background: rgba(255, 255, 255, 0.75);
            font-size: 10.5px;
        }

        .leaflet-bottom.leaflet-right .leaflet-control-scale {
            margin: 0 16px 8px 0;
        }

        /* ===== Marker titik asal (titik biru berdenyut) ===== */
        .origin-dot {
            background: none;
            border: none;
        }

        .origin-dot .core {
            position: absolute;
            inset: 5px;
            border-radius: 50%;
            background: var(--blue);
            border: 3px solid #FFFFFF;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .origin-dot .pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.35);
            animation: pulse 1.8s ease-out infinite;
        }

        @keyframes pulse {
            from { transform: scale(0.6); opacity: 1; }
            to   { transform: scale(2.4); opacity: 0; }
        }

        /* ===== Legenda kemacetan (rute dengan data TomTom) ===== */
        .traffic-legend {
            margin: 16px 16px 0 0 !important;
            padding: 8px 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            font-size: 12px;
            color: var(--text);
        }

        .traffic-legend-title {
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
        }

        .traffic-legend-row {
            display: flex;
            align-items: center;
            margin-top: 2px;
        }

        .traffic-legend-row span {
            width: 18px;
            height: 5px;
            margin-right: 8px;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Lebar card yang menutupi sisi kiri peta (400 + margin 16 di MainWindow).
        // Dipakai supaya titik yang difokuskan tidak tertutup card.
        const CARD_OFFSET_X = 416 / 2;

        const DEFAULT_CENTER = [-7.7928, 110.3658]; // Yogyakarta (sekitar Malioboro)
        const DEFAULT_ZOOM = 14;

        // INISIALISASI PETA
        const map = L.map('map', {
            zoomControl: false,
            zoomSnap: 0.5
        });

        // Geser pusat ke kanan supaya tidak tertutup card
        function viewWithOffset(latlng, zoom) {
            const point = map.project(latlng, zoom)
                .subtract([CARD_OFFSET_X, 0]);
            return map.unproject(point, zoom);
        }

        map.setView(viewWithOffset(DEFAULT_CENTER, DEFAULT_ZOOM), DEFAULT_ZOOM);

        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // Tile OpenStreetMap standar (gratis, tanpa API key)
        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        ).addTo(map);

        map.attributionControl.setPrefix(false);

        // IKON
        const destinationIcon = L.divIcon({
            className: 'eco-pin',
            iconSize: [36, 46],
            iconAnchor: [18, 44],
            popupAnchor: [0, -42],
            html:
                '<div class="pin-shadow"></div>' +
                '<svg width="36" height="46" viewBox="0 0 36 46" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M18 1C8.6 1 1 8.4 1 17.6 1 29.8 18 45 18 45s17-15.2 17-27.4C35 8.4 27.4 1 18 1z" ' +
                'fill="#16A34A" stroke="#FFFFFF" stroke-width="2"/>' +
                // daun kecil di tengah pin
                '<path d="M24.5 11.5c-7.5 0-12 3.8-12 9.4 0 1.3.3 2.4.8 3.4l-2 2 1.2 1.2 2-2c1 .6 2.2.9 3.5.9 5.4 0 6.5-6.6 6.5-14.9z" fill="#FFFFFF"/>' +
                '<path d="M14.5 24.5c2.5-3.2 5-5.2 7.5-6.5" stroke="#16A34A" stroke-width="1.4" fill="none" stroke-linecap="round"/>' +
                '</svg>'
        });

        const originIcon = L.divIcon({
            className: 'origin-dot',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
            popupAnchor: [0, -12],
            html: '<div class="pulse"></div><div class="core"></div>'
        });

        L.control.scale({
            position: 'bottomright',
            imperial: false,
            maxWidth: 90
        }).addTo(map);

        // TEMPAT POPULER
        // Data tempat dikirim dari WPF (MainViewModel.TempatPopuler) lewat setPopularPlaces().
        const svgIcon = function (inner) {
            return '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.8" ' +
                'stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
        };

        const CATEGORY_STYLE = {
            Wisata: {
                color: '#E11D48',
                icon: svgIcon('<rect x="1.5" y="4.5" width="13" height="9" rx="2"/><circle cx="8" cy="9" r="2.4"/><path d="M5.5 4.5l1-2h3l1 2"/>')
            },
            Kuliner: {
                color: '#EA580C',
                icon: svgIcon('<path d="M4 1.5v13M2 1.5v4a2 2 0 0 0 4 0v-4"/><path d="M11.5 14.5v-13c-1.8 1-2.5 3-2.5 5.5 0 1.2.8 2 2.5 2"/>')
            },
            Kampus: {
                color: '#7C3AED',
                icon: svgIcon('<path d="M1 6l7-3.5L15 6 8 9.5z"/><path d="M4 7.5v3.5c1 1.2 2.4 1.8 4 1.8s3-.6 4-1.8V7.5"/>')
            },
            Transportasi: {
                color: '#2563EB',
                icon: svgIcon('<rect x="3" y="1.5" width="10" height="10" rx="2.5"/><path d="M3 7h10"/><path d="M5.5 14.5l1.2-3M10.5 14.5l-1.2-3"/>')
            },
            Belanja: {
                color: '#DB2777',
                icon: svgIcon('<path d="M2.5 5h11l-1 9.5h-9z"/><path d="M5.5 7V4a2.5 2.5 0 0 1 5 0v3"/>')
            },
            Taman: {
                color: '#16A34A',
                icon: svgIcon('<path d="M8 1.5L3 8h3l-2.5 3.5h9L10 8h3z"/><path d="M8 11.5v3"/>')
            }
        };

        const poiLayer = L.layerGroup().addTo(map);
        let popularPlaces = [];
        let activeCategory = null;
        let selectedName = null;

        function createPoiMarker(place) {
            const style = CATEGORY_STYLE[place.kategori] || CATEGORY_STYLE.Wisata;

            const wrapper = document.createElement('div');
            wrapper.className = 'poi-inner';

            const dot = document.createElement('div');
            dot.className = 'poi-dot';
            dot.style.background = style.color;
            dot.innerHTML = style.icon;

            const label = document.createElement('div');
            label.className = 'poi-label';
            label.style.color = style.color;
            label.textContent = place.nama;

            wrapper.appendChild(dot);
            wrapper.appendChild(label);

            const marker = L.marker([place.lat, place.lng], {
                icon: L.divIcon({
                    className: 'poi',
                    html: wrapper,
                    iconSize: null,
                    iconAnchor: [12, 12]
                }),
                title: place.nama + ' (' + place.kategori + ')',
                riseOnHover: true
            });

            marker.on('click', function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({
                        type: 'placeClicked',
                        nama: place.nama
                    });
                }
            });

            return marker;
        }

        function renderPopularPlaces() {
            poiLayer.clearLayers();

            popularPlaces
                .filter(function (p) {
                    // Tempat yang sedang dipilih sudah ditandai pin hijau
                    if (p.nama === selectedName) return false;
                    return activeCategory === null || p.kategori === activeCategory;
                })
                .forEach(function (p) {
                    poiLayer.addLayer(createPoiMarker(p));
                });
        }

        function setPopularPlaces(places) {
            popularPlaces = Array.isArray(places) ? places : [];
            renderPopularPlaces();
        }

        function setCategoryFilter(category) {
            activeCategory = category || null;
            renderPopularPlaces();
        }

        function setPopularVisible(visible) {
            if (visible) {
                if (!map.hasLayer(poiLayer)) map.addLayer(poiLayer);
            } else if (map.hasLayer(poiLayer)) {
                map.removeLayer(poiLayer);
            }
        }

        function updateLabelVisibility() {
            map.getContainer().classList.toggle(
                'hide-poi-labels',
                map.getZoom() < 13.5
            );
        }

        map.on('zoomend', updateLabelVisibility);
        updateLabelVisibility();

        // MARKER
        let selectedMarker = null;
        let originMarker = null;

        // Hanya aktif saat State C
        let canSelectOrigin = false;

        // MARKER TUJUAN
        function showLocation(lat, lng, nama) {
            if (!Number.isFinite(lat) ||
                !Number.isFinite(lng)) {
                return;
            }

            if (selectedMarker !== null) {
                map.removeLayer(selectedMarker);
            }

            selectedName = nama || null;
            renderPopularPlaces();

            selectedMarker = L.marker([lat, lng], {
                icon: destinationIcon,
                zIndexOffset: 1000
            }).addTo(map);

            const popup = document.createElement('div');
            popup.className = 'location-popup';
            popup.textContent = nama || 'Lokasi dipilih';

            const caption = document.createElement('small');
            caption.textContent = 'Tujuan';
            popup.appendChild(caption);

            selectedMarker.bindPopup(popup, {
                closeButton: false
            });

            const zoom = 16;
            map.flyTo(viewWithOffset([lat, lng], zoom), zoom, {
                duration: 0.8
            });

            map.once('moveend', function () {
                if (selectedMarker) selectedMarker.openPopup();
            });
        }

        function showLocationFromWpf(location) {
            if (!location) return;

            showLocation(
                Number(location.lat),
                Number(location.lng),
                location.nama
            );
        }

        function clearLocation() {
            if (selectedMarker !== null) {
                map.removeLayer(selectedMarker);
                selectedMarker = null;
            }

            if (selectedName !== null) {
                selectedName = null;
                renderPopularPlaces();
            }
        }

        // MARKER TITIK ASAL
        function showOrigin(lat, lng) {
            if (originMarker !== null) {
                map.removeLayer(originMarker);
            }

            originMarker = L.marker([lat, lng], {
                icon: originIcon
            }).addTo(map);

            originMarker.bindPopup('Titik Asal', {
                closeButton: false
            }).openPopup();
        }

        // Pratinjau titik awal sebelum Hitung Emisi (data dari MapView.xaml.cs).
        // pan = false saat asalnya klik peta: titiknya sudah terlihat, peta tidak perlu digeser.
        function showOriginPreview(origin) {
            if (!origin) return;

            const lat = Number(origin.lat);
            const lng = Number(origin.lng);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

            showOrigin(lat, lng);

            const popup = document.createElement('div');
            popup.className = 'location-popup';
            popup.textContent = origin.nama || 'Titik Asal';
            const caption = document.createElement('small');
            caption.textContent = 'Titik Asal';
            popup.appendChild(caption);
            originMarker.bindPopup(popup, { closeButton: false });

            if (origin.pan === false) {
                originMarker.openPopup();
                return;
            }

            const zoom = Math.max(map.getZoom(), 16);
            map.flyTo(viewWithOffset([lat, lng], zoom), zoom, { duration: 0.8 });
            map.once('moveend', function () {
                if (originMarker) originMarker.openPopup();
            });
        }

        function clearOrigin() {
            if (originMarker !== null) {
                map.removeLayer(originMarker);
                originMarker = null;
            }
        }

        // GARIS RUTE (State D), data dari OSRM lewat MapView.xaml.cs
        let routeLine = null;

        function showRoute(route) {
            if (!route || !Array.isArray(route.points) || route.points.length < 2) {
                return;
            }

            clearRoute();

            // Garis putih tebal di bawah supaya rute tetap kontras di atas peta
            const layers = [
                L.polyline(route.points, { color: '#FFFFFF', weight: 9, opacity: 0.9 })
            ];

            if (Array.isArray(route.segments) && route.segments.length > 0) {
                // Data live TomTom: tiap segmen diwarnai sesuai tingkat kemacetannya
                route.segments.forEach(function (s) {
                    const style = TRAFFIC_STYLE[s.level] || TRAFFIC_STYLE.Lancar;
                    const points = route.points.slice(s.from, s.to + 1);
                    if (points.length < 2) return;

                    layers.push(
                        L.polyline(points, { color: style.color, weight: 5, opacity: 0.95 })
                            .bindTooltip(
                                style.label + ' · ' + Math.round(s.ratio * 100) + '% dari kecepatan normal',
                                { sticky: true }
                            )
                    );
                });
                showTrafficLegend(true);
            } else {
                layers.push(L.polyline(route.points, { color: '#16A34A', weight: 5, opacity: 0.95 }));
                showTrafficLegend(false);
            }

            routeLine = L.featureGroup(layers).addTo(map);

            showOrigin(route.origin.lat, route.origin.lng);

            // Pin tujuan tanpa animasi flyTo (peta di-fit ke seluruh rute di bawah)
            if (selectedMarker !== null) {
                map.removeLayer(selectedMarker);
            }
            selectedMarker = L.marker([route.destination.lat, route.destination.lng], {
                icon: destinationIcon,
                zIndexOffset: 1000
            }).addTo(map);

            const popup = document.createElement('div');
            popup.className = 'location-popup';
            popup.textContent = route.destination.nama || 'Tujuan';
            const caption = document.createElement('small');
            caption.textContent = 'Tujuan';
            popup.appendChild(caption);
            selectedMarker.bindPopup(popup, { closeButton: false });

            // Sisakan ruang di kiri untuk card supaya rute tidak tertutup
            map.fitBounds(routeLine.getBounds(), {
                paddingTopLeft: [CARD_OFFSET_X * 2 + 40, 60],
                paddingBottomRight: [60, 60],
                maxZoom: 17
            });
        }

        function clearRoute() {
            if (routeLine !== null) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            showTrafficLegend(false);
        }

        // WARNA KEMACETAN (nama level sama dengan enum TingkatKemacetan di C#)
        const TRAFFIC_STYLE = {
            Lancar: { color: '#16A34A', label: 'Lancar' },
            Sedang: { color: '#EAB308', label: 'Sedang' },
            Padat:  { color: '#F97316', label: 'Padat' },
            Macet:  { color: '#DC2626', label: 'Macet' }
        };

        // Legenda warna kemacetan, hanya tampil saat rute punya data live TomTom
        const trafficLegend = L.control({ position: 'topright' });
        trafficLegend.onAdd = function () {
            const div = L.DomUtil.create('div', 'traffic-legend');
            const title = document.createElement('div');
            title.className = 'traffic-legend-title';
            title.textContent = 'Lalu lintas (TomTom)';
            div.appendChild(title);

            Object.keys(TRAFFIC_STYLE).forEach(function (key) {
                const row = document.createElement('div');
                row.className = 'traffic-legend-row';
                const swatch = document.createElement('span');
                swatch.style.background = TRAFFIC_STYLE[key].color;
                row.appendChild(swatch);
                row.appendChild(document.createTextNode(TRAFFIC_STYLE[key].label));
                div.appendChild(row);
            });
            return div;
        };
        let trafficLegendVisible = false;

        function showTrafficLegend(visible) {
            if (visible && !trafficLegendVisible) {
                trafficLegend.addTo(map);
            } else if (!visible && trafficLegendVisible) {
                trafficLegend.remove();
            }
            trafficLegendVisible = visible;
        }

        // MENGATUR IZIN KLIK PETA
        function setOriginSelectionEnabled(enabled) {
            canSelectOrigin = enabled === true;

            if (!canSelectOrigin) {
                map.getContainer().style.cursor = '';
            } else {
                map.getContainer().style.cursor = 'crosshair';
            }
        }

        // KLIK PETA
        map.on('click', function (event) {
            if (!canSelectOrigin) {
                return;
            }

            const lat = event.latlng.lat;
            const lng = event.latlng.lng;

            showOrigin(lat, lng);

            if (window.chrome &&
                window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'mapClicked',
                    lat: lat,
                    lng: lng
                });
            }
        });

        // MEMBERI TAHU WPF PETA SUDAH SIAP
        map.whenReady(function () {
            if (window.chrome &&
                window.chrome.webview) {
                window.chrome.webview.postMessage({
                    type: 'mapReady'
                });
            }
        });
    </script>
</body>
</html>
